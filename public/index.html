<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Accueil - M2L Réservation</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

  <!-- Navbar -->
  <div id="navbarContainer"></div>

  <!-- Introduction -->
  <header class="hero">
    <h1>Bienvenue sur M2L Réservation</h1>
    <p>Réservez vos créneaux sportifs à la Maison des Ligues de Lorraine</p>
    <img src="/images/banner-temporaire.jpg" alt="Bannière multisport" class="hero-image">
  </header>

  <!-- Appel à l'action -->
  <div class="cta-container">
    <a href="/login" class="cta-button">Réserver maintenant</a>
  </div>

  <!-- Notifications -->
  <div id="notification-container"></div>

  <!-- Footer -->
  <div id="footerContainer"></div>

  <script src="/js/navbar.js"></script>
  <script>
    fetch("/partials/footer.html")
      .then(res => res.text())
      .then(html => document.getElementById("footerContainer").innerHTML = html);
  </script>
</body>
</html>
